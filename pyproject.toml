[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-flow"
version = "0.1.0"
description = "Industrial PI/PIMS data bridge for Kafka, Google Pub/Sub and data lake ingestion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Industrial Flow Contributors" }]
dependencies = [
    "PyYAML>=6.0.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4.0"]
pubsub = ["google-cloud-pubsub>=2.21.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]
all = ["confluent-kafka>=2.4.0", "google-cloud-pubsub>=2.21.0", "pytest>=8.2.0", "ruff>=0.5.0"]

[project.scripts]
industrial-flow = "industrial_flow.cli:app"

[tool.setuptools.packages.find]
include = ["industrial_flow*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
